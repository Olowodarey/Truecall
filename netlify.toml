# Netlify configuration for Next.js
[build]
  base = "frontend"
  command = "npm install -g pnpm@10.32.1 && pnpm install && pnpm run build"
  publish = "frontend/.next"

[build.environment]
  NODE_VERSION = "20"

# Next.js on Netlify - use the official plugin
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables (set these in Netlify dashboard)
# NEXT_PUBLIC_API_URL=https://truecall-production.up.railway.app/api
# NEXT_PUBLIC_TWITTER_CLIENT_ID=ZGFtYjlOY2ZlRTF3ZDFYMGJVTHo6MTpjaQ
