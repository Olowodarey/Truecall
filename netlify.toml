# Netlify configuration for Next.js with pnpm
[build]
  base = "frontend"
  command = "npx pnpm@10.32.1 install && npx pnpm@10.32.1 run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Next.js on Netlify - use the official plugin
[[plugins]]
  package = "@netlify/plugin-nextjs"
